events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Dynamic Tenant Routing Gateway (ADR-011)
    server {
        listen 80;
        server_name ethenengine.com www.ethenengine.com localhost _;

        # 1. Main Platform API & Web UI
        location / {
            proxy_pass http://ethenengine-core:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Keycloak IAM Portal Routing
        location /auth/ {
            proxy_pass http://ethenengine-keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Rust Microservice Routing
        location /api/rust/ {
            proxy_pass http://ethenengine-rust:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
